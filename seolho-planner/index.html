<title>설호 학습 플래너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 자이언츠체: (주)롯데자이언츠 배포 서체. 원본 파일을 변환·수정하지 않고 그대로 사용. */
@font-face{font-family:'Giants';src:url(fonts/Giants-Regular.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Giants';src:url(fonts/Giants-Bold.ttf) format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Kkukkuk';src:url(fonts/kk.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Busan';src:url(fonts/bsM.woff2) format('woff2');font-weight:100 600;font-display:swap}
@font-face{font-family:'Busan';src:url(fonts/bsB.woff2) format('woff2');font-weight:700 900;font-display:swap}
@font-face{font-family:'GiantsInline';src:url(fonts/Giants-Inline.ttf) format('truetype');font-weight:400;font-display:swap}
/* Layout: tablet-first. Left tab rail in landscape, bottom tab bar in portrait.
   Schedule is a grid of ballpark zones (거실/돌봄/책상 구장) x innings, one item per cell. */
:root{
  --bg:#F0F3F9; --panel:#FFFFFF; --ink:#0B1A33; --muted:#53617E; --line:#D3DAE8;
  --navy:#05182F; --on-navy:#FFFFFF; --red:#DD032F;
  --green:#177A4B; --on-green:#FFFFFF; --green-bg:#DDF3E7;
  --done:#DD032F; --on-done:#FFFFFF; --done-bg:#FCE4E9;
  --amber-bg:#FFF0C7; --amber:#6B4700; --today-bg:#FDECEF;
  --chip-bg:#E3EAF7; --chip-ink:#0E2C66; --we:#1B3466;
  --f-d:'Giants','Noto Sans KR',system-ui,sans-serif;
  --f-b:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050E20; --panel:#0B1A36; --ink:#EAF0FB; --muted:#9FB0CC; --line:#1E3052;
    --navy:#12295A; --on-navy:#FFFFFF; --red:#FF5470;
    --green:#52D28F; --on-green:#07281A; --green-bg:#16382B;
    --done:#FF5470; --on-done:#2A0610; --done-bg:#3A1220;
    --amber-bg:#3A2F10; --amber:#F3C969; --today-bg:#33121F;
    --chip-bg:#16315F; --chip-ink:#C5D4FF; --we:#1B3466; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050E20; --panel:#0B1A36; --ink:#EAF0FB; --muted:#9FB0CC; --line:#1E3052;
  --navy:#12295A; --on-navy:#FFFFFF; --red:#FF5470;
  --green:#52D28F; --on-green:#07281A; --green-bg:#16382B;
  --done:#FF5470; --on-done:#2A0610; --done-bg:#3A1220;
  --amber-bg:#3A2F10; --amber:#F3C969; --today-bg:#33121F;
  --chip-bg:#16315F; --chip-ink:#C5D4FF; --we:#1B3466; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:18.5px;line-height:1.5;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:18px;overflow:hidden}
.nav{width:92px;flex:none;background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;gap:8px;padding:14px 10px}
.brand{font-family:var(--f-d);font-weight:700;font-size:18.5px;text-align:center;line-height:1.3;margin:2px 0 10px}
.nav button{appearance:none;border:0;background:transparent;color:inherit;font:500 15px/1.2 var(--f-b);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:68px;border-radius:12px;padding:8px 4px}
.nav button.on{background:#DD032F;color:#fff;font-weight:700}
.nav button:focus-visible,.row:focus-visible,.btn:focus-visible,.btn2:focus-visible,td.ed:focus-visible{outline:3px solid #FFC83D;outline-offset:2px}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync{margin-top:auto;font-size:12.5px;text-align:center;opacity:.8;line-height:1.3}
.main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px}
h1{font-family:var(--f-d);font-weight:700;font-size:34.5px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0 0 10px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.date{color:var(--muted);font-size:16px}
.head{align-items:flex-start}
.head .tt{display:flex;align-items:center;gap:10px;min-height:44px}
.head .date{margin-top:4px}
.head .navb,.head .sndb{width:44px;height:44px}
.head .chip,.head .btn2{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;margin:0;font:700 16px var(--f-b);line-height:1;border-radius:22px;white-space:nowrap}
.head .btn2{border:1px solid var(--line)}
.head .brow{align-items:center;gap:8px}
.chip{background:var(--chip-bg);color:var(--chip-ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;white-space:nowrap}
.lbl{font-size:16px;color:var(--muted)}
.today{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:22px;align-items:start}
.board{display:flex;gap:4px;margin:6px 0 4px}
.board i{flex:1;min-width:0;height:30px;border-radius:6px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font:700 14px var(--f-b);font-style:normal}
.board i.d{background:var(--done);color:var(--on-done)}
.sec{font-size:15px;font-weight:700;color:var(--muted);margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.sec:first-child{margin-top:0}
.rw{position:relative;display:flow-root}
.rw .row{padding-right:132px}
.tmb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;position:absolute;right:10px;top:calc((100% - 8px)/2);transform:translateY(-50%);min-width:112px;height:48px;border-radius:24px;border:2px solid var(--navy);background:var(--panel);color:var(--navy);font:inherit;font-size:17px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;cursor:pointer}
.tmb b{font-weight:700;font-size:17px;color:inherit}
.tmb.pz{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.tmb.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tmb.on b{font-variant-numeric:tabular-nums}
.luo{position:fixed;inset:0;z-index:50;background:rgba(4,30,66,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.lub{width:100%;max-width:400px;max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.4)}
.lut{background:var(--navy);color:var(--on-navy);padding:14px 18px 13px;position:relative;flex:none}
.lut::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#D00F31}
.lut small{opacity:.78;font-size:14px;letter-spacing:.08em}
.lut h3{margin:2px 0 0;font-size:25.5px}
.lub ol{list-style:none;margin:0;padding:8px 12px;display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.lub li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:18.5px}
.lub li:last-child{border-bottom:0}
.lub li b.n{width:28px;height:28px;border-radius:50%;background:var(--chip-bg,#E1E8F5);display:grid;place-items:center;font-size:15px}
.lub li b.n.d{background:var(--green,#177A4B);color:#fff}
.lub .tgs{display:flex;gap:4px}
.lt{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip-bg,#E1E8F5);color:var(--ink)}
.lt.t2{background:var(--amber-bg);color:var(--amber)}
.lt.t3{background:var(--green-bg);color:var(--green)}
.lt.tm{background:var(--navy);color:var(--on-navy)}
.luf{padding:8px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:none}

function dayStat(i,ds){
  var N=0,dn=0,all=0,ad=0,f2=0,d2=0,f3=0,d3=0;
  SLOTS.forEach(function(sl){

    if(m&1){f2++;if(d)d2++}
    if(m&2){f3++;if(d)d3++}
  });

}

function periodCard(c){
  var r=pRange(c),P=[['today','오늘'],['week','주간'],['month','월간'],['year','연간'],['all','누적']];
  var seg=P.map(function(x){return '<button type="button" class="btn2'+(S.per===x[0]?' on':'')+'" data-act="per" data-v="'+x[0]+'" aria-pressed="'+(S.per===x[0])+'">'+x[1]+'</button>'}).join('');
  var nav=(S.per==='today'||S.per==='all')?'<div class="lbl" style="margin-top:10px"><b>'+r.lab+'</b></div>':
    '<div class="pnav"><button type="button" class="btn2" data-act="pnav" data-v="-1" aria-label="이전">◀</button><b>'+r.lab+'</b><button type="button" class="btn2" data-act="pnav" data-v="1" aria-label="다음"'+(S.po>=0?' disabled':'')+'>▶</button></div>';
  var cell=function(l,v,hi){return '<div'+(hi?' class="hi"':'')+'><small>'+l+'</small><b>'+v+'</b></div>'};
  var f3=function(v){return v>=1?v.toFixed(3):v.toFixed(3).replace(/^0/,'')};
  var body='';
  if(S.per==='today'){
    var inf=dayInfo(c.now,c),y=inf.y;
    var st=inf.rain?'🌧️ 우천 취소':(y.n===0?'쉬는 날':(inf.fin?'⚾ 경기 종료':'🔥 경기 진행 중'));
    body='<div class="win" style="margin:10px 0 0">'+st+'</div><div class="sl">'+
      cell('완료 항목',y.dn+' / '+y.n)+cell('타수',y.ab)+cell('안타',fmtH(y.h))+cell('2루타',y.b2)+cell('3루타',y.b3)+cell('홈런',y.hr)+cell('볼넷',(function(){var nm=DAYS[c.ti].s,ds=doneSet(c.tk);return (nm.r0&&ds.has(nm.r0)?1:0)})())+'</div>'+
      '<div class="sl">'+cell('오늘 타율',(y.ab&&inf.fin)?avg(y.h,y.ab):'경기 후 공개',1)+'</div>'+
      (!inf.fin&&!inf.rain&&y.n>0?'<p class="lbl" style="margin:8px 0 0">진행 중인 기록이에요. 경기가 끝나면 시즌 기록에 더해져요.</p>':'');
  }else{
    var o=pStats(c,r),pa=o.ab+o.bb,obp=pa?(o.h+o.bb)/pa:0,slg=o.ab?o.tb/o.ab:0;
    if(!o.days)body='<p class="lbl" style="margin:12px 0 0">이 기간에는 끝난 경기가 없어요.'+(o.rain?' (우천 취소 '+o.rain+'일)':'')+'</p>';
    else body='<div class="sl">'+cell('출전(G)',o.g)+cell('결장',o.absent)+cell('출전율',rate(o.g,o.days)+'%')+cell('타석',pa)+cell('타수',o.ab)+cell('안타',fmtH(o.h))+cell('볼넷',o.bb)+cell('2루타',o.b2)+cell('3루타',o.b3)+cell('홈런',o.hr)+'</div>'+
      '<div class="sl">'+cell('타율',avg(o.h,o.ab),1)+cell('출루율',pa?f3(obp):'—')+cell('장타율',o.ab?f3(slg):'—')+cell('OPS',pa?f3(obp+slg):'—',1)+cell('멀티히트',o.mh)+cell('완료 항목',o.items)+(o.rain?cell('우천 취소',o.rain):'')+'</div>';
  }
  var mv=(S.per==='week'&&S.po===0)?mvpOf(c):null;
  body+=chartsHtml(c,r);
  var mvHtml=mv?'<div class="win" style="margin:12px 0 0">🏅 이번 주 MVP · '+DOW[mv.i]+'요일 (안타 '+fmtH(mv.h)+(mv.hr?' · 홈런':'')+')</div>':'';
  return '<div class="card" style="margin-top:12px"><h2>기록표 <span class="lbl">끝난 경기 기준</span></h2><div class="seg" role="group" aria-label="기간 선택">'+seg+'</div>'+nav+body+mvHtml+'</div>';
}

function recordCards(ss,c){
  var pa=ss.ab+ss.bb,obp=pa?(ss.h+ss.bb)/pa:0,slg=ss.ab?ss.tb/ss.ab:0,ops=obp+slg;
  var f3=function(v){return v>=1?v.toFixed(3):v.toFixed(3).replace(/^0/,'')};
  var cell=function(l,v,hi){return '<div'+(hi?' class="hi"':'')+'><small>'+l+'</small><b>'+v+'</b></div>'};
  var line1=cell('출전(G)',ss.g)+cell('결장',ss.absent)+cell('출전율',ss.g+ss.absent?rate(ss.g,ss.g+ss.absent)+'%':'—')+cell('타석',pa)+cell('타수',ss.ab)+cell('안타',fmtH(ss.h))+cell('볼넷',ss.bb)+cell('2루타',ss.b2)+cell('3루타',ss.b3)+cell('홈런',ss.hr);
  var line2=cell('타율',avg(ss.h,ss.ab),1)+cell('출루율',pa?f3(obp):'—')+cell('장타율',ss.ab?f3(slg):'—')+cell('OPS',pa?f3(ops):'—',1)+cell('멀티히트',ss.mh);
  var mv=mvpOf(c);
  var mvHtml=mv?'<div class="win" style="margin:12px 0 0">🏅 이번 주 MVP · '+DOW[mv.i]+'요일 (안타 '+fmtH(mv.h)+(mv.hr?' · 홈런':'')+')</div>':'';
  var card1='<div class="card" style="margin-top:12px"><h2>시즌 기록표 <span class="lbl">끝난 경기 기준</span></h2><div class="sl">'+line1+'</div><div class="sl">'+line2+'</div>'+mvHtml+'</div>';
  var recs=[['최장 연속 출전',ss.apBest+'경기','지금 '+ss.ap+'경기째'],['최장 연속 안타',ss.hsBest+'경기','지금 '+ss.hs+'경기째'],['한 주 최다 안타',fmtH(ss.maxWkH),''],['한 주 최다 홈런',ss.maxWkHR,''],['사이클링 히트',ss.cyc+'회','월~일 전부 클리어'],['하루 최고 안타',ss.bestDay?fmtH(ss.bestDay.h):'—',ss.bestDay?ss.bestDay.k.slice(5).replace('-','월 ')+'일':'']];
  var card2='<div class="card" style="margin-top:12px"><h2>시즌 최고 기록</h2>'+recs.map(function(x){return '<div class="kv"><span>'+x[0]+'</span><span><b>'+x[1]+'</b>'+(x[2]?' <span class="lbl">'+x[2]+'</span>':'')+'</span></div>'}).join('')+'</div>';
  var ms=Object.keys(ss.mo).sort(),bestM=null;
  ms.forEach(function(k){var m=ss.mo[k];if(m.ab>=10&&(!bestM||m.h/m.ab>ss.mo[bestM].h/ss.mo[bestM].ab))bestM=k});
  var mrows=ms.slice(-6).map(function(k){var m=ss.mo[k],v=m.ab?m.h/m.ab:0;
    return '<div class="rk"><span class="n">'+(+k.slice(5))+'월'+(k===bestM?' 🥇':'')+'</span><div class="meter"><b style="width:'+Math.min(100,Math.round(v/0.5*100))+'%"></b></div><b>'+avg(m.h,m.ab)+'</b><span class="lbl">'+m.g+'경기</span></div>'}).join('');
  var rival='';
  if(ms.length>=2){var a=ss.mo[ms[ms.length-1]],b=ss.mo[ms[ms.length-2]];
    if(a.ab&&b.ab){var da=a.h/a.ab-b.h/b.ab;rival='<p class="lbl" style="margin:8px 0 0">라이벌은 지난달의 나! 이번 달 타율이 지난달보다 '+(da>=0.0005?'<b>'+(da).toFixed(3).replace(/^0/,'')+' 높아요 💪</b>':da<=-0.0005?Math.abs(da).toFixed(3).replace(/^0/,'')+' 낮아요. 따라잡아 봐요!':'똑같아요')+'</p>'}}
  var card3='<div class="card" style="margin-top:12px"><h2>월간 타율 · 순위</h2>'+(mrows||'<div class="lbl">경기가 쌓이면 월별 기록이 나와요.</div>')+rival+'</div>';
  var prow=GROUPS.map(function(g,i){var p=ss.pl[i];if(!p)return '';var v=p.d/p.t;
    return '<div class="rk"><span class="n">'+esc(g)+(i===0?' (홈)':'')+'</span><div class="meter"><b style="width:'+Math.round(v*100)+'%"></b></div><b>'+avg(p.d/2,p.t)+'</b><span class="lbl">'+Math.round(v*100)+'%</span></div>'}).join('');
  var srows=axes().filter(function(x){return ss.sb[x]&&ss.sb[x].t>0}).map(function(x){var q=ss.sb[x],v=q.d/q.t;
    return '<div class="rk"><span class="n">'+esc(x)+'</span><div class="meter"><b style="width:'+Math.round(v*100)+'%"></b></div><b>'+avg(q.d/2,q.t)+'</b><span class="lbl">'+Math.round(v*100)+'%</span></div>'}).join('');
  var bl=Object.keys(ss.bk).filter(function(k){return ss.bk[k].t>=3}).map(function(k){return {n:k,v:ss.bk[k].d/ss.bk[k].t,t:ss.bk[k].t}}).sort(function(a,b){return b.v-a.v});
  var bk=function(a){return a.map(function(x){return '<div class="kv"><span>'+esc(x.n)+'</span><span><b>'+Math.round(x.v*100)+'%</b> <span class="lbl">'+x.t+'경기</span></span></div>'}).join('')};
  var strong=bl.slice(0,3),weak=bl.length>3?bl.slice(-3).reverse():[];
  var card4='<div class="card" style="margin-top:12px"><h2>구장별 · 상대별 성적</h2><div class="cols"><div><div class="lbl">구장(장소)별 타율</div>'+(prow||'<div class="lbl">—</div>')+'<div class="lbl" style="margin-top:10px">상대(과목)별 타율</div>'+(srows||'<div class="lbl">—</div>')+'</div><div>'+
    (bl.length?'<div class="lbl">잘 잡는 상대 (문제집)</div>'+bk(strong)+(weak.length?'<div class="lbl" style="margin-top:10px">까다로운 상대</div>'+bk(weak):''):'<div class="lbl">같은 문제집을 3번 이상 만나면 상대 전적이 나와요.</div>')+'</div></div></div>';
  return periodCard(c)+card2+card3+card4;
}

function renderHome(c){
  var p=S.profile,ss=seasonStats(c),st=stats(),its=itemsOf(c.ti),ds=doneSet(c.tk),n=0,lv=levelOf(ss.xp),inf=dayInfo(c.now,c),note=recentNote(c);

  if(!p.no||!p.motto)empty=true;
  var btn=(!S.pedit&&!S.pgate)?'<button class="btn2" type="button" data-act="pedit">프로필 수정</button>':'';
  var xpLine='<div class="lvl"><span class="pteam" style="margin:0">'+esc(lv.cur.n)+'</span><b>성장 점수 '+ss.xp+'</b>'+(lv.nx?'<span class="lbl">'+esc(lv.nx.n)+'까지 '+(lv.nx.x-ss.xp)+'점</span>':'<span class="lbl">최고 단계!</span>')+'<div class="meter"><b style="width:'+lv.pct+'%"></b></div></div>';
  main.innerHTML=
   '<div class="head"><div><h1>선수 프로필</h1><div class="date">'+DOW[c.ti]+'요일 · '+(c.now.getMonth()+1)+'월 '+c.now.getDate()+'일</div></div>'+btn+'</div>'+top+
   (note?'<div class="win" style="margin:0 0 14px">🧢 감독의 한마디 · “'+esc(note)+'”</div>':'')+
   '<div class="pcard"><div class="pphoto"><img src="face.jpg" alt="'+esc(p.name)+' 사진"></div><div>'+
   (p.team?'<span class="pteam">'+esc(p.team)+'</span>':'')+
   '<div class="pname"><h1>'+esc(p.name)+'</h1><span class="pno">No. '+(p.no?esc(p.no):'—')+'</span></div>'+
   '<div class="pg">'+grid+'</div>'+xpLine+(p.motto?'<div class="pmotto">“'+esc(p.motto)+'”</div>':'')+
   (empty&&!S.pedit?'<p class="lbl" style="margin:12px 0 0">— 표시는 프로필 수정 버튼으로 채울 수 있어요. 등번호와 포지션을 직접 정해 보세요!</p>':'')+
   '</div></div>'+

   '<div class="card"><div class="lbl">이번 주 타율</div><div class="big">'+avg(st.w.h,st.w.ab)+'</div></div>'+

    if(!next.name){er.textContent='이름을 입력하세요.';er.hidden=false;return}
    S.profile=next;saveProfile();S.pedit=false;
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    render();
  });
}

function homeClick(e){
  if(S.tab!=='home')return;
  var g=e.target.closest('[data-go]');
  if(g){S.tab=g.dataset.go;S.unlocked=false;S.pedit=false;S.pgate=false;render();main.scrollTop=0;return}
  var b=e.target.closest('button[data-act]');
  if(!b)return;
  var a=b.dataset.act;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(a==='pedit'){if(S.unlocked)S.pedit=true;else S.pgate=true;render()}
  else if(a==='pcancel'){S.pedit=false;S.pgate=false;render()}
  else if(a==='per'){var st0=main.scrollTop;S.per=b.dataset.v;S.po=0;render();main.scrollTop=st0}
  else if(a==='pnav'){var st1=main.scrollTop;S.po=Math.min(0,S.po+(+b.dataset.v));render();main.scrollTop=st1}
}
function diamondSvg(st){
  var on=function(k){return st>=k?' on':''};
  function base(x,y,k){return '<rect class="bs'+on(k)+'" x="-8" y="-8" width="16" height="16" transform="translate('+x+' '+y+') rotate(45)"/>'}
  return '<svg class="dia" viewBox="0 0 120 120" role="img" aria-label="베이스 진행 상황"><polygon class="ln" points="60,104 104,60 60,16 16,60"/>'+
    base(104,60,1)+base(60,16,2)+base(16,60,3)+
    '<polygon class="bs hp'+on(4)+'" points="60,114 69,106 66,96 54,96 51,106"/></svg>';
}
function scoreboard(its,ds){
  var h='',m='';
  its.forEach(function(it){
    var lab=/^\d/.test(it.t)?it.t.replace('이닝',''):it.t.charAt(0);
    var d=ds.has(it.n);
    h+='<span class="h">'+esc(lab)+'</span>';
    m+='<span class="c'+(d?' d':'')+'">'+(d?'●':'○')+'</span>';
  });
  return '<div class="sb" style="grid-template-columns:repeat('+its.length+',1fr)" aria-hidden="true">'+h+m+'</div>';
}
function viewCtx(r){var d=new Date(r.now.getFullYear(),r.now.getMonth(),r.now.getDate()+S.vo),ti=(d.getDay()+6)%7,dates=[];for(var i=0;i<7;i++)dates.push(new Date(d.getFullYear(),d.getMonth(),d.getDate()-ti+i));return {now:d,ti:ti,dates:dates,tk:key(d)}}

  else inner='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h5M12 2.5v3"/><circle cx="12" cy="14" r="7.5"/><path d="M12 14l3-3"/></svg><b>'+(sec?tmMin(sec):'시작')+'</b>';
  return '<button type="button" class="tmb'+cls+'" data-act="tm" data-ti="'+i+'" aria-label="'+esc(it.n)+' 타이머">'+inner+'</button>';
}
var lpT=null,lpFired=false,lpXY=null;
function lpClear(){clearTimeout(lpT);lpT=null}
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest&&e.target.closest('.tmb[data-ti]');if(!b)return;lpFired=false;lpClear();lpXY=[e.clientX,e.clientY];
  lpT=setTimeout(function(){lpT=null;if(S.vo)return;var c=ctx(),it=itemsOf(c.ti)[+b.dataset.ti];if(!it)return;
    lpFired=true;if(navigator.vibrate){try{navigator.vibrate(40)}catch(x){}}S.rs={k:c.tk,n:it.n};fx('un');render()},650)});
['pointerup','pointercancel'].forEach(function(ev){document.addEventListener(ev,lpClear)});
document.addEventListener('pointermove',function(e){if(lpT&&lpXY&&Math.abs(e.clientX-lpXY[0])+Math.abs(e.clientY-lpXY[1])>14)lpClear()});
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.tmb'))e.preventDefault()});
document.addEventListener('click',function(e){if(lpFired&&e.target.closest&&e.target.closest('.tmb')){lpFired=false;e.stopPropagation();e.preventDefault()}},true);
function tmPanel(){

function applyPick(d,sid,name){
  var targets=syncTargets(d,sid);
  targets.forEach(function(t){
    var day=DAYS[t],x=day.x||(day.x={}),old=day.s[sid],q=null;
    if(name)SLOTS.forEach(function(sl){if(sl.id!==sid&&day.s[sl.id]===name)q=sl.id});
    if(q){ /* 같은 요일 다른 칸에 이미 있으면 서로 자리를 바꾼다 (2루타·3루타 표시는 칸에 그대로 남는다) */
      day.s[q]=old;day.s[sid]=name;

    }
  });

function saveOpts(){

    seen[v]=1;list.push({n:v,s:sj});
    if(o&&o!==v)ren.push([o,v]);
  }
  var oldKeys=Object.keys(SUBJ);
  ren.forEach(function(r){
    var oldN=r[0],newN=r[1],ts=[];
    DAYS.forEach(function(d,t){
      var hit=null;SLOTS.forEach(function(q){if(d.s[q.id]===oldN)hit=q.id});
      if(!hit)return;
      if(SLOTS.some(function(q){return d.s[q.id]===newN}))return;

function doImport(){
  var t=($('bkin')?$('bkin').value:'').trim();
  try{
    var j=JSON.parse(t);
    if(!j||typeof j!=='object'||!j.checks||typeof j.checks!=='object')throw new Error('bad');
    var okd=0;
    Object.keys(j.checks).forEach(function(k){
      if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(j.checks[k])){
        var arr=j.checks[k].filter(function(x){return typeof x==='string'});
        S.checks[k]=arr;queueWrite(k,arr);okd++;
      }
    });
    if(j.meta&&typeof j.meta==='object')S.meta=j.meta;
    if(j.settings&&typeof j.settings==='object'){
      if(j.settings.tiers)S.settings.tiers=j.settings.tiers;
      if(j.settings.goal)S.settings.goal=j.settings.goal;
      if(j.settings.reward)S.settings.reward=j.settings.reward;
    }
    if(j.sched)applySched(j.sched);
    if(j.profile)applyProfile(j.profile);
    saveMeta();saveSettings();saveSched();saveProfile();
    S.bkmsg={t:'복원했어요 ('+okd+'일치 기록).',ok:true};
  }catch(e){S.bkmsg={t:'형식이 맞지 않아요. 복사해 둔 글자를 그대로 붙여 넣어 주세요.',ok:false}}
  render();
}

function setClick(e){

  else if(a==='skin'){S.skin=v;prefsSave();applySkin();render();fx('badge')}
  else if(a==='prev'){fx(v)}

    if(b.dataset.bz)return;b.dataset.bz='1';var old=b.textContent;b.textContent='확인 중…';
    var u=location.href.split('#')[0].split('?')[0];
    try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()})}catch(x){}
    var done=function(msg){b.textContent=old;delete b.dataset.bz;S.toast=msg;clearTimeout(toastT);toastT=setTimeout(function(){S.toast='';render()},5000);render()};
    fetch(u+'?_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
      var m=/ver:(\d+)\}/.exec(t),nv=m?+m[1]:0;
      if(nv&&nv<=APP.ver){done('이미 최신 버전이에요 ('+VS(APP.ver)+')');return}

      try{localStorage.setItem('seolho-resume',JSON.stringify({t:Date.now(),tab:S.tab,msg:'✅ '+(nv?VS(nv):'최신 버전')+'으로 업데이트했어요'}))}catch(x){}
      var jobs=[];
      if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('seolho-app')===0}).map(function(k){return caches.delete(k)}))}));
      var sw=navigator.serviceWorker;if(sw&&sw.getRegistrations)jobs.push(sw.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.update()}))}));
      Promise.all(jobs.map(function(q){return q.catch(function(){})})).then(function(){setTimeout(function(){try{location.reload()}catch(x){done('이 화면을 닫고 링크를 다시 열어 주세요.')}},300)});

  }
}

/* 퀴즈 3문제 고르기: 틀린 문제 복습(하루 이상 지난 것) 최대 1개 + 안 본 문제 */
function plPickDaily(){
  var p=plGet(),today=key(new Date()),pick=[];
  var due=Object.keys(p.wr).filter(function(i){return p.wr[i]!==today&&QB[+i]});
  if(due.length)pick.push(+due[plRnd(due.length)]);
  var pool=QB.map(function(_,i){return i}).filter(function(i){return p.seen.indexOf(i)<0&&pick.indexOf(i)<0});
  if(pool.length<3-pick.length){p.seen=[];pool=QB.map(function(_,i){return i}).filter(function(i){return pick.indexOf(i)<0})}
  pool=plShuf(pool);while(pick.length<3)pick.push(pool.shift());
  return plShuf(pick);
}

function plMakePitch(){
  var t=plRnd(10),a,b,txt,ans;
  if(t<6){a=2+plRnd(8);b=2+plRnd(8);txt=a+' × '+b;ans=a*b}
  else if(t<8){a=11+plRnd(60);b=3+plRnd(30);txt=a+' + '+b;ans=a+b}
  else{a=30+plRnd(60);b=3+plRnd(a-10<25?a-10:25);txt=a+' − '+b;ans=a-b}
  var set={};set[ans]=1;var tries=0;while(Object.keys(set).length<3&&tries++<30){var d=ans+(plRnd(2)?1:-1)*(1+plRnd(Math.max(3,Math.min(10,ans>20?10:5))));if(d>0&&d!==ans)set[d]=1}
  return {txt:txt,ans:ans,o:plShuf(Object.keys(set).map(Number))}
}

function plStopGame(){if(S.g){clearTimeout(S.g.to);clearTimeout(S.g.nx);S.g.live=false}}
function plSwing(j){var g=S.g;if(!g||!g.live||g.res)return;clearTimeout(g.to);
  var ok=j>=0&&g.pitch.o[j]===g.pitch.ans;
  if(ok){g.streak++;g.hits++;var big=g.streak>=3;g.score+=big?30:10;if(big)g.hr++;g.res=big?'hr':'hit';fx(big?'hr':'bt')}
  else{g.streak=0;g.res=j<0?'late':'miss';fx('un')}
  g.show=g.pitch.ans;plDraw();
  g.nx=setTimeout(function(){g.i++;
    if(g.i>=10){g.live=false;g.end=true;var p=plGet(),today=key(new Date());
      if(!p.gd[today]||g.score>p.gd[today])p.gd[today]=g.score;
      p.best=Math.max(p.best||0,g.score);g.rec=g.score>=p.best&&g.score>0;
      plSave();fx(g.score>=80?'hr':'end')}
    else{g.pitch=plMakePitch();g.res=null;g.show=null;plArm()}
    plDraw()},g.res==='miss'||g.res==='late'?1100:800);
}

    '<button type="button" class="plc" data-act="plkbo"><b>📚 KBO 2026 선수 도감</b><span>10개 구단 621명 + 레전드 41명 · 구단/포지션/이름 검색</span><em>수집 '+Object.keys(kbPl().c).length+' / '+(KB.length+CARDS.length)+'명</em></button>'+
    '</div>';
  }else if(v==='quiz'){
    var q=S.q;
    if(!q){S.pv='hub';return renderPlay(c)}
    if(q.end){
      var tot=q.list.length;
      h=plBack()+'<div class="card plres"><div class="plbig">'+(q.right===tot?'🎉 만점 안타!':q.right>=2?'⚾ 안타!':'💪 다음엔 더!')+'</div><div class="pl2">'+tot+'타수 '+q.right+'안타'+(q.mode==='rev'?' · 오답 '+q.fixed+'개 지웠어요':'')+'</div>'+
        '<div class="brow"><button type="button" class="btn" data-act="plhub">놀이터로</button>'+'</div></div>';
    }else{
      var cur=q.list[q.i],ans=q.pick>=0;
      h=plBack()+'<div class="plq"><div class="plp">'+(q.mode==='rev'?'📝 오답 복습':'⚾ 퀴즈 타석')+' · '+(q.i+1)+' / '+q.list.length+'타석 <span class="plcat">'+esc(cur.c)+'</span></div>'+
        '<div class="plqt">'+esc(cur.q)+'</div><div class="plo">'+cur.o.map(function(o,j){
          var cl='plob';if(ans){if(o.ok)cl+=' ok';else if(j===q.pick)cl+=' no'}
          return '<button type="button" class="'+cl+'" data-act="plans" data-j="'+j+'"'+(ans?' disabled':'')+'>'+esc(o.t)+'</button>'}).join('')+'</div>'+
        (ans?'<div class="plfb '+(cur.o[q.pick].ok?'g':'r')+'">'+(cur.o[q.pick].ok?'딱! 안타! 🎉':'아쉬워요! 정답은 “'+esc(cur.o.filter(function(o){return o.ok})[0].t)+'”'+(q.mode==='quiz'?'<br><small>틀린 문제는 오답 복습에 담아 둘게요.</small>':''))+'</div><button type="button" class="btn" data-act="plnext" style="width:100%">'+(q.i+1>=q.list.length?'결과 보기':'다음 타석 →')+'</button>':'')+'</div>';
    }
  }else if(v==='game'){
    var g=S.g;if(!g){S.pv='hub';return renderPlay(c)}
    if(g.end){
      h=plBack()+'<div class="card plres"><div class="plbig">'+(g.score>=80?'💥 홈런왕!':g.score>=50?'⚾ 좋은 타격!':'💪 수고했어요!')+'</div><div class="pl2">'+g.score+'점 · 안타 '+g.hits+'개 · 홈런 '+g.hr+'개'+(g.rec?'<br>🏅 나의 최고 기록!':'')+'</div>'+
        ''+
        '<div class="brow"><button type="button" class="btn" data-act="plgame">한 판 더!</button><button type="button" class="btn2" data-act="plhub">놀이터로</button></div></div>';
    }else{
      var pt=g.pitch;
      h='<button type="button" class="btn2" data-act="plgx" style="margin:0 0 12px">← 그만하기</button><div class="plq"><div class="plp">🏏 홈런 더비 · '+(g.i+1)+' / 10구 <span class="plcat">'+g.score+'점'+(g.streak>=2?' · 🔥'+g.streak+'연속':'')+'</span></div>'+
        '<div class="plbar"><i'+(g.res?' style="animation:none;width:0"':'')+'></i></div>'+
        '<div class="plqt big">'+pt.txt+' = ?</div><div class="plo three">'+pt.o.map(function(n,j){
          var cl='plob';if(g.res){if(n===pt.ans)cl+=' ok';else if(g.res!=='hit'&&g.res!=='hr'&&false)cl+=' no'}
          return '<button type="button" class="'+cl+'" data-act="plswing" data-j="'+j+'"'+(g.res?' disabled':'')+'>'+n+'</button>'}).join('')+'</div>'+
        '<div class="plfb '+(g.res==='hit'||g.res==='hr'?'g':g.res?'r':'')+'" style="min-height:52px">'+(g.res==='hr'?'💥 홈런!! (3연속 보너스 +30)':g.res==='hit'?'⚾ 안타! +10':g.res==='late'?'⏰ 헛스윙… 정답은 '+g.show:g.res==='miss'?'❌ 아쉬워요! 정답은 '+g.show:'공이 날아와요! 정답을 골라 치세요')+'</div></div>';
    }
  }else if(v==='kbo'){h=kbHtml();main.innerHTML=head+h;return
  }else if(v==='kview'){h=kbView();main.innerHTML=head+h;return
  }
  main.innerHTML=head+h;
}
function plDraw(){if(S.tab==='play')renderPlay(ctx())}
function playClick(e){
  var b=e.target.closest('button[data-act]');if(!b)return;var a=b.dataset.act;if(a.indexOf('pl')!==0)return;
  if(a==='plgame'&&S.tab!=='play'){S.tab='play';document.querySelectorAll('#nav button').forEach(function(x){x.classList.toggle('on',x.dataset.t==='play')})}
  if(a==='plunlock'){var pi=document.getElementById('plpin');if(pi&&pi.value===String(S.settings.pin)){S.plUntil=Date.now()+30*60000;S.plErr=false;fx('hr')}else{S.plErr=true;fx('un')}}
  else if(a==='plhub'){plStopGame();S.pv='hub';S.q=null;S.g=null;fx('ck')}
  else if(a==='plquiz'){plStartQuiz();if(!S.q||S.q.end)S.pv='hub';fx('ck')}
  else if(a==='plrev'){plStartRev();fx('ck')}
  else if(a==='plgame'){plStartGame();fx('ck')}
  else if(a==='plgx'){plStopGame();S.g=null;S.pv='hub'}
  else if(a==='plans'){plAnswer(+b.dataset.j)}
  else if(a==='plnext'){plNext()}
  else if(a==='plswing'){plSwing(+b.dataset.j);return}
  else if(!kbAct(a,b))return;
  renderPlay(ctx());renderSync();main.scrollTop=0;
}

prefsLoad();applySkin();
loadLocal();adoptShipped();
try{var rs=JSON.parse(localStorage.getItem('seolho-resume')||'null');localStorage.removeItem('seolho-resume');
  if(rs&&Date.now()-rs.t<120000){if(rs.tab)S.tab=rs.tab;S.toast=rs.msg||'';toastT=setTimeout(function(){S.toast='';render()},5000)}}catch(e){}
render();

(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    DB=await window.claude.use('db');
  }catch(e){DB=null}
  if(!DB){render();return}
  S.live=true;S.checks={};render();
  var timer=setTimeout(function(){S.store='local';renderSync()},10000);
  DB.collection('checks').onSnapshot(function(snap){
    var m={};
    snap.docs.forEach(function(d){var x=d.data();m[d.id]=(x&&x.done)||[]});
    S.checks=m;
    if(!snap.metadata.fromCache){clearTimeout(timer);S.store='shared'}
    saveLocal();render();
  },function(){clearTimeout(timer);S.store='local';render()});
  DB.doc('settings/profile').onSnapshot(function(s){
    if(s.exists){applyProfile(s.data());saveLocal();render()}
  },function(){});
  DB.doc('settings/schedule').onSnapshot(function(s){
    if(s.exists){applySched(s.data());saveLocal();render()}
  },function(){});
  DB.doc('settings/main').onSnapshot(function(s){
    if(s.exists){var x=s.data()||{};['goal','reward','pin','tiers'].forEach(function(k){if(x[k]!==undefined)S.settings[k]=x[k]});saveLocal();render()}
  },function(){});
  DB.doc('settings/play').onSnapshot(function(s){
    if(s.exists){var x=s.data();if(x&&typeof x==='object'){S.play=x;saveLocal();if(S.tab==='play'&&!(S.pv==='game'&&S.g&&S.g.live)&&!(S.pv==='quiz'&&S.q&&!S.q.end))render();else if(S.tab!=='play')render()}}
  },function(){});
  DB.doc('settings/daymeta').onSnapshot(function(s){
    if(s.exists){var x=s.data()||{};S.meta=(x.m&&typeof x.m==='object')?x.m:{};saveLocal();render()}
  },function(){});
})();
})();

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
